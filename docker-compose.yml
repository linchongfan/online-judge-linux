services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: xinbaoyan
      MYSQL_USER: oj
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uoj", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.10.3
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-data:
  redis-data:
